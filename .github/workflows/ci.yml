name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m unittest discover -v
      - run: itera-connect --version

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install . -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m build

  magpie:
    runs-on: ubuntu-latest
    env:
      ITERACONNECT_HOME: ${{ github.workspace }}/.local/ci
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install .
      - run: itera-connect install-magpie
      - name: Verify real Magpie translation and five native config adapters with fixture backend
        run: |
          export ITERACONNECT_TEST_MAGPIE_BIN="$ITERACONNECT_HOME/bin/magpie"
          python -m unittest tests.test_magpie.MagpieTests -v

  checks:
    if: always()
    needs: [test, quality, magpie]
    runs-on: ubuntu-latest
    steps:
      - name: Require every validation job
        env:
          TEST_RESULT: ${{ needs.test.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          MAGPIE_RESULT: ${{ needs.magpie.result }}
        run: |
          test "$TEST_RESULT" = success
          test "$QUALITY_RESULT" = success
          test "$MAGPIE_RESULT" = success
