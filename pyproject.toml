[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "iteracompute-agent-connect"
version = "0.1.0"
description = "A simple local client to connect model APIs to coding harnesses and agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES"]
authors = [{name = "IteraCompute"}]
dependencies = []

[project.scripts]
itera-connect = "iteraconnect.cli:main"

[project.urls]
Homepage = "https://github.com/IteraCompute/agent-connect"
Issues = "https://github.com/IteraCompute/agent-connect/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
iteraconnect = ["upstreams.lock.json", "upstream-notices.txt", "web/*.html", "web/*.css", "web/*.js"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "PGH003", "PGH004", "RUF100"]

[tool.mypy]
files = ["src/iteraconnect"]
python_version = "3.11"
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = "iteraconnect.config"
disallow_untyped_defs = true
disallow_any_generics = true
warn_return_any = true

[tool.importlinter]
root_package = "iteraconnect"

[[tool.importlinter.contracts]]
name = "Runtime dependencies point from entry points toward configuration"
type = "layers"
containers = ["iteraconnect"]
exhaustive = true
layers = [
    "__main__",
    "cli",
    "app",
    "smoke",
    "diagnostics | gateway | integrations | launch | native",
    "network | settings",
    "config",
]
